# ─────────────────────────────────────────────────────────────────────────────
# Регламент: Индексы жизни города (вычисляются в браузере из данных экологии)
# Версия 1.0 — Фаза 0, инициализирована из computeLifeIndices() в index.html
#
# Фаза 3: эти же значения будут использоваться Python-бэкендом (GET /life-indices)
# Версия 1.1 — 2026-11-18: водитель — мороз и ветер; гололёд — отдельной ветвью по влаге
#              (ecology_rules, ice_level), как в РАГРАФ. «Зоны льда» по одной температуре убраны.
# Версия 1.2 — 2026-11-18: «Коммунальное напряжение» → «Погодная нагрузка на ЖКХ»: мороз и снегопад,
#              «штиль + загрязнение» убран (смог — экология). Водитель: снегопад, как на табло.
# ─────────────────────────────────────────────────────────────────────────────
version: "1.2"

# ── Индекс водителя: 0 = безопасно, 10 = крайне опасно ──────────────────────
driver:
  # Гололёд — по влаге, а не по одной температуре (ecology_rules 1.1, ice_level на сегодня):
  # в сухую погоду около нуля льда нет; прежнее правило «−3…+2 °C: +5» не прошло проверку на ДТП
  ice_glaze_score: 5            # «гололёд»: ледяной дождь или морось в прогнозе
  ice_refreeze_score: 3         # «возможна гололедица»: днём дождь от 1 мм, ночью до −1 °C
  # Мороз (суммируется с гололёдом и ветром)
  temp_extreme_cold: -25.0      # °C — ниже этого: +3
  temp_extreme_cold_score: 3
  temp_severe_cold: -20.0       # °C — ниже этого (но ≥ -25): +2
  temp_severe_cold_score: 2
  temp_cold: -10.0              # °C — ниже этого (но ≥ -20): +1
  temp_cold_score: 1
  # Ветер
  wind_strong_ms: 12.0          # м/с — сильный ветер: +2
  wind_strong_score: 2
  wind_moderate_ms: 8.0         # м/с — умеренный ветер: +1
  wind_moderate_score: 1
  # Снегопад — видимость и сцепление (snow_impact 0–10 из прогноза на 3 суток)
  snow_moderate_threshold: 5    # snow_impact ≥ 5 → +1
  snow_moderate_score: 1
  snow_heavy_threshold: 8       # snow_impact ≥ 8 → +2
  snow_heavy_score: 2
  # Пороги уровней (≤ значения)
  levels:
    - {max: 2, label: "Безопасно"}
    - {max: 5, label: "Осторожно"}
    - {max: 7, label: "Опасно"}
    - {max: 10, label: "Крайне опасно"}

# ── Индекс прогулки: 0 = сиди дома, 10 = идеально ───────────────────────────
walk:
  start_score: 10               # начальное значение, штрафы вычитаются
  # PM2.5 штрафы
  pm25_high: 35.0               # мкг/м³ — -4
  pm25_high_penalty: 4
  pm25_medium: 25.0             # мкг/м³ — -2
  pm25_medium_penalty: 2
  pm25_low: 15.0                # мкг/м³ — -1
  pm25_low_penalty: 1
  # AQI штрафы
  aqi_very_high: 80             # — -3
  aqi_very_high_penalty: 3
  aqi_high: 60                  # — -2
  aqi_high_penalty: 2
  aqi_medium: 40                # — -1
  aqi_medium_penalty: 1
  # Температурные штрафы
  temp_extreme: -25.0           # °C — -3
  temp_extreme_penalty: 3
  temp_cold: -15.0              # °C — -2
  temp_cold_penalty: 2
  temp_chilly: -5.0             # °C — -1
  temp_chilly_penalty: 1
  # Ветер
  wind_threshold_ms: 10.0       # м/с — -1
  wind_penalty: 1
  # Пороги уровней (≥ значения)
  levels:
    - {min: 8, label: "Отличные условия"}
    - {min: 6, label: "Хорошие условия"}
    - {min: 4, label: "Ограниченно"}
    - {min: 0, label: "Рекомендуется остаться дома"}

# ── Погодная нагрузка на ЖКХ: 0 = норма, 10 = критично ──────────────────────
# Только погода: мороз по ночному минимуму (теплосети) и снегопад (уборка, кровли). Это не
# загрузка бригад — её даёт прогноз ЖКХ на 2 недели. Расчётная температура отопления
# Новосибирска −37 °C (СП 131.13330.2018).
utility:
  # Температурные добавки по минимальной температуре (minT)
  temp_critical: -30.0          # °C — +4
  temp_critical_score: 4
  temp_severe: -20.0            # °C — +3
  temp_severe_score: 3
  temp_cold: -10.0              # °C — +2
  temp_cold_score: 2
  temp_cool: -5.0               # °C — +1
  temp_cool_score: 1
  # Снегопад — добавка к погодной нагрузке
  # snow_impact приходит из прогноза (ecology_rules.yaml → snow_impact)
  snow_light_threshold: 2       # snow_impact ≥ 2 → +1
  snow_light_score: 1
  snow_moderate_threshold: 5    # snow_impact ≥ 5 → +2
  snow_moderate_score: 2
  snow_heavy_threshold: 8       # snow_impact ≥ 8 → +3
  snow_heavy_score: 3
  # Пороги уровней (≤ значения)
  levels:
    - {max: 2, label: "Норма"}
    - {max: 5, label: "Повышенная"}
    - {max: 7, label: "Высокая"}
    - {max: 10, label: "Критическая"}
