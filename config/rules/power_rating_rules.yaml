# ─────────────────────────────────────────────────────────────────────────────
# Регламент: Рейтинг качества ЖКХ по районам
# Версия 2.0 — накопительная модель: балл собирается из трёх компонентов
# ─────────────────────────────────────────────────────────────────────────────
#
# Что изменилось против 1.0 и зачем.
#
# В версии 1.0 балл считался как «10 минус штрафы». Штрафы были маленькие, и
# все районы упирались в потолок: при пороге A ≥ 8.0 весь город получал A, а
# разброс баллов составлял 1.4 при том, что доля дней без аварий у районов
# различалась втрое (15.6% против 44.5%). То есть показатель, который лучше
# всего описывает состояние сетей, почти не влиял на оценку.
#
# В версии 2.0 балл СОБИРАЕТСЯ, а не отнимается. Каждый компонент нормируется
# между «плохо» и «хорошо» и умножается на вес; сумма весов = 10. Компоненты,
# которые реально различают районы (надёжность и нагрузка), получают полный
# размах, а внутридневные метрики работают модификатором, как и задумывалось.
#
# Якоря bad/good ниже — управленческое решение, а не свойство данных. Их
# правят в Студии, когда меняется представление о норме.
# ─────────────────────────────────────────────────────────────────────────────
version: "2.0"

# ── Общие параметры ─────────────────────────────────────────────────────────
general:
  analysis_days: 30           # окно по умолчанию (дней); UI умеет запрашивать всю глубину
  min_score: 0.0
  max_score: 10.0

# ── Временные зоны суток ────────────────────────────────────────────────────
# Определяют, когда считаются утренние, вечерние, ночные аварии
time_zones:
  morning:
    start_hour: 6             # утро: 06:00 – 12:00
    end_hour: 12
  evening:
    start_hour: 18            # вечер: 18:00 – 22:00
    end_hour: 22
  night:
    start_hour: 22            # ночь: 22:00 – 06:00
    end_hour: 6

# ── Компоненты балла ────────────────────────────────────────────────────────
# Каждый компонент даёт от 0 до weight баллов. Нормировка линейная:
#   значение = bad  → 0 баллов
#   значение = good → weight баллов
# За пределами диапазона — обрезается. Сумма весов = max_score.
#
# Направление шкалы задаётся самими якорями: у «нагрузки» bad больше good,
# потому что чем больше домов без ресурса, тем хуже.

scoring:
  reliability:
    weight: 4.0
    metric: clean_ratio       # доля дней без аварийных отключений
    bad: 0.0                  # аварии каждый день без исключения
    good: 0.55                # 55% и выше — больше половины дней спокойные
    # Якорь bad держим на нуле: в разгар ремонтной кампании летом у половины
    # районов за 30 дней ни одного чистого дня, и порог даже в 5% обнулял бы
    # компонент оптом, лишая короткое окно различающей силы.
    description: "Надёжность: как часто район вообще живёт без аварий"

  load:
    weight: 4.0
    metric: active_avg_daily  # среднесуточное число аварийных домов
    bad: 200                  # 200 домов/сутки в среднем — тяжёлая ситуация
    good: 10                  # 10 и меньше — единичные адреса
    description: "Масштаб: сколько жителей в среднем остаётся без ресурса"

  intraday:
    weight: 2.0
    description: "Режим работы: когда именно происходят аварии"
    # Три подкомпонента с равным весом внутри intraday.
    # Доли считаются от суммарной аварийной нагрузки (домо-часов), а не по
    # признаку «была ли авария»: в миллионнике ночью почти всегда что-то
    # отключено, и бинарный признак районы не различает вовсе.
    parts:
      night_share:
        bad: 0.45             # 45% нагрузки ночью — люди без ресурса во сне
        good: 0.18            # 18% и ниже — ночь разгружена
      evening_share:
        bad: 0.25             # 25% вечером — пик возвращения домой
        good: 0.04
      weekend_share:
        bad: 0.45             # доля аварийных дней, пришедшихся на выходные
        good: 0.18

# ── Грейды ──────────────────────────────────────────────────────────────────
# Пороги: score >= threshold → grade
#
# Шкала A-F сохранена, но откалибрована так, что город в рабочем состоянии
# распределяется по A/B/C. D и F зарезервированы под настоящий провал —
# аварии практически каждый день при сотнях домов без ресурса. Если район
# упал в D, это повод для разбора, а не фон.

grades:
  - { grade: "A", threshold: 7.0, label: "Отлично",            color: "emerald" }
  - { grade: "B", threshold: 5.0, label: "Хорошо",             color: "green" }
  - { grade: "C", threshold: 3.0, label: "Удовлетворительно",  color: "yellow" }
  - { grade: "D", threshold: 1.5, label: "Плохо",              color: "orange" }
  - { grade: "F", threshold: 0.0, label: "Критично",           color: "red" }

# ── Fallback-расчёт (для городов без почасовых снимков) ─────────────────────
# Когда нет внутридневной детализации, компонент intraday недоступен.
# Его вес перераспределяется на надёжность и нагрузку пропорционально,
# чтобы шкала оставалась 0-10 и грейды не съезжали.

fallback:
  redistribute_intraday: true
