# ─────────────────────────────────────────────────────────────────────────────
# Регламент: прогноз загрузки ЖКХ на 1–2 недели (табло мэра и начальника района)
# Версия 1.0 — ПРАВИЛО, а не модель. Разбор: docs/ZHKH-PROGNOZ-RAZBOR.md
# ─────────────────────────────────────────────────────────────────────────────
#
# Ячейка прогноза — «район × услуга × день». Для каждого рабочего дня горизонта
# берутся те же дни недели за последние history_weeks недель (только дни, когда
# сборщик работал) и считается, в какой доле из них были плановые работы и
# в какой доле объём работ превышал ёмкость бригад.
#
# ЁМКОСТЬ БРИГАД — ГИПОТЕЗА. Численности бригад в данных нет. Ёмкость района
# по услуге = quantile-процентиль объёма рабочих дней с работами за window_weeks
# недель, умноженный на factor. При quantile 0.75 и factor 1.0 это читается так:
# «бригады района справляются с объёмом, какой был в трёх из четырёх загруженных
# дней; больше — уже перегруз». Считаете, что бригады могут больше, — поднимите
# factor. Это управленческое допущение, а не свойство данных.
#
# Объём — «домов в списке»: плановые дома ÷ число снимков, в которых отключение
# висело. Так же считает «Отчёт за всё время», поэтому цифры на табло совпадают.
#
# Почему не медиана и не среднее (замер 2026-11-16, рабочие дни 19.10–13.11):
# «среднее за 4 недели ≥ 1,5 × медиана» давало 80 перегруженных ячеек из 500
# на две недели при точности 28%. Одна тяжёлая неделя раздувает среднее.
# Вариант «превышение 75-го процентиля в половине опорных дней» даёт около
# 36 ячеек при точности около 24% и базе 10%. Перегруз предсказывается слабо,
# поэтому табло показывает его самопроверку рядом.
# ─────────────────────────────────────────────────────────────────────────────
version: "1.0"

horizon_days: 14          # горизонт прогноза, суток вперёд от завтрашнего дня
history_weeks: 4          # профиль дня недели — по последним N неделям
min_ref_days: 3           # меньше опорных дней → статус «нет данных»
free_max_share: 0.25      # «свободно»: работы были не чаще чем в 1 из 4 таких дней

capacity:
  window_weeks: 12        # окно, по которому оценивается ёмкость
  min_days: 5             # меньше рабочих дней с работами → ёмкость не оценивается
  quantile: 0.75          # ГИПОТЕЗА: ёмкость = 75-й процентиль объёма загруженных дней…
  factor: 1.0             # …умноженный на этот коэффициент
  overload_share: 0.5     # «перегруз»: объём превышал ёмкость хотя бы в половине опорных дней

risk:
  window_days: 28         # риск аварий — доля дней с аварией за последние N суток

backtest:
  window_days: 28         # самопроверка правила на последних N сутках
  min_lag_weeks: 2        # прогноз «как если бы» сделан за 2 недели (худший горизонт)
