# ─────────────────────────────────────────────────────────────────────────────
# Регламент: прогноз загрузки ЖКХ на 1–2 недели (табло мэра и начальника района)
# Версия 1.1 — калибровка по режимам отопления. Правило, а не модель.
# Разборы: docs/ZHKH-PROGNOZ-RAZBOR.md (v1), docs/ZHKH-KALIBROVKA-RAZBOR.md (v2)
# ─────────────────────────────────────────────────────────────────────────────
#
# ОЦЕНЩИК (estimator):
#   eb_regime — v2. Режим «отопление включено / выключено» по температуре; опорные дни —
#               тот же день недели в том же режиме; оценка сглаживается к обычной частоте
#               работ района по услуге в этом режиме: p = (k + a·b) / (n + a).
#               Вероятности откалиброваны: «свободно 80%» сбывается примерно в 80%.
#   weekday   — v1. Тот же день недели за последние недели, p = k / n.
#               Чтобы вернуть v1 целиком, поставьте также free_max_share: 0.25.
#
# Почему не коэффициенты по месяцам: в истории каждый месяц встречается один раз,
# подобранное «под июль» нечем проверить. Лучший способ оценки меняется на границе
# отопительного периода, а не по календарю (замер 2026-11-17, scripts/zhkh_calibration/).
#
# ЁМКОСТЬ БРИГАД — ГИПОТЕЗА. Численности бригад в данных нет. Ёмкость района по
# услуге = quantile-процентиль объёма рабочих дней с работами за window_weeks недель
# × factor. Для услуг из regime_utilities — только по дням того же режима: иначе
# у тепла летние недели без работ занижают ёмкость, и любой зимний объём выглядит
# перегрузом. Коэффициенты процентиля и factor — управленческое допущение.
#
# Объём — «домов в списке»: плановые дома ÷ число снимков, в которых висело
# плановое отключение (planned_records). Так же считает «Отчёт за всё время».
# ─────────────────────────────────────────────────────────────────────────────
version: "1.1"

estimator: eb_regime      # eb_regime (v2) | weekday (v1)
horizon_days: 14          # горизонт прогноза, суток вперёд от завтрашнего дня
history_weeks: 4          # опорные дни — столько последних таких же дней недели
min_ref_days: 3           # только для weekday: меньше опорных дней → «нет данных»
free_max_share: 0.35      # «свободно»: вероятность работ не выше (уверенность ≥ 65%)
                          # выбрано на неделях выпуска 27.04–12.10, проверено на 19.10–9.11

shrinkage:
  strength: 4             # a: сколько «виртуальных» опорных дней даёт обычная частота
  base_weeks: 8           # b: частота работ ячейки за столько недель…
  min_base_days: 5        # …в том же режиме, если таких рабочих дней не меньше этого

regime:                   # отопление включено после run_days суток подряд ниже порога,
  threshold_c: 8.0        # выключено после run_days суток подряд выше порога
  run_days: 5             # (по среднесуточной температуре; медиана районов СИМА)

capacity:
  window_weeks: 12        # окно, по которому оценивается ёмкость
  min_days: 5             # меньше рабочих дней с работами → ёмкость не оценивается
  quantile: 0.75          # ГИПОТЕЗА: ёмкость = 75-й процентиль объёма загруженных дней…
  factor: 1.0             # …умноженный на этот коэффициент
  overload_share: 0.5     # «перегруз»: объём превышал ёмкость хотя бы в половине опорных дней
  regime_utilities: [heating]   # ёмкость этих услуг — в пределах режима отопления

risk:
  window_days: 28         # риск аварий — доля дней с аварией за последние N суток

backtest:
  window_days: 28         # самопроверка правила на последних N сутках
  min_lag_weeks: 2        # прогноз «как если бы» выпущен за 2 недели (худший горизонт)
