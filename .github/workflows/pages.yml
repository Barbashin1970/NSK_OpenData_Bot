# Демо-копия лендинга СИМА на GitHub Pages: https://barbashin1970.github.io/NSK_OpenData_Bot/
# Основной сайт — Railway (живой API); из российских сетей без VPN он не открывается,
# а github.io открывается. Pages раздаёт только файлы, поэтому сюда идёт копия лендинга
# со снимком ответов API — scripts/dlya_pages.py. Страницы управления выключены.
# Разбор: docs/PAGES-DEMO-RAZBOR.md.
# Включить один раз: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Версии действий проверены по API релизов 17.11.2026: deploy-pages@v4 (2024) не находил
# артефакт нового upload-artifact — «No artifacts named github-pages» (урок PROMPT-Professor).
name: Демо лендинга на GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/static/index.html"
      - "src/static/img/**"
      - "src/static/manifest.json"
      - "scripts/dlya_pages.py"
      - ".github/workflows/pages.yml"
  schedule:
    # запасной ход (Р-20): GitHub задерживает и пропускает плановые запуски — 17–18.11 за 22 часа
    # из «17 * * * *» сработали два. Слотов три в час; лишний запуск выходит сразу, если
    # опубликованному снимку меньше 45 минут (scripts/pages_svezhest.py)
    - cron: "7,27,47 * * * *"
  workflow_dispatch:            # основной ход — раз в час с Railway (src/pages_dispatch.py, Р-16)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publikaciya.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # сначала — включены ли Pages: если нет, запуск падает сразу, не трогая Railway
      - id: pages
        uses: actions/configure-pages@v6
      - id: svezhest
        name: Свежесть демо — плановому запуску сборка нужна, только если снимок старше 45 минут
        if: github.event_name == 'schedule'
        run: python3 scripts/pages_svezhest.py "${{ steps.pages.outputs.base_url }}" 45 >> "$GITHUB_OUTPUT"
      - name: Копия лендинга и снимок данных с Railway
        if: steps.svezhest.outputs.svezhij != '1'
        env:
          SIMA_API: ${{ vars.SIMA_API || 'https://nsk-opendata-bot.up.railway.app' }}
        run: python3 scripts/dlya_pages.py --osnova "/${{ github.event.repository.name }}" --vyhod _pages --api "$SIMA_API"
      - uses: actions/upload-pages-artifact@v5
        if: steps.svezhest.outputs.svezhij != '1'
        with:
          path: _pages
      - id: publikaciya
        if: steps.svezhest.outputs.svezhij != '1'
        uses: actions/deploy-pages@v5
